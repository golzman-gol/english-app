<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Word Catch</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Word Catch</h1>
      <button id="enable-push" class="link-button" type="button" data-mode="enable">Enable notifications</button>
    </header>
    <p id="push-status" class="push-status"></p>

    <main>
      <section id="add-panel" class="tab-panel active">
        <form id="add-word-form" class="add-form">
          <label class="field-label" for="word-input">Word</label>
          <input
            id="word-input"
            type="text"
            placeholder="e.g. serendipity"
            autocomplete="off"
            autocapitalize="off"
            required
          />

          <label class="field-label" for="translation-input">Translation (optional — auto-filled if left blank)</label>
          <input id="translation-input" type="text" placeholder="Hebrew translation" autocomplete="off" dir="rtl" />

          <label class="field-label" for="sentence-input">Example sentence (optional)</label>
          <textarea id="sentence-input" placeholder="Use the word in a sentence..." rows="2"></textarea>

          <button type="submit">Save word</button>
        </form>
        <ul id="word-list" class="word-list"></ul>
      </section>

      <section id="practice-panel" class="tab-panel">
        <div id="flashcard" class="flashcard"></div>
        <p id="practice-progress" class="practice-progress"></p>

        <div class="practice-controls" id="show-answer-controls">
          <button id="show-answer-btn" type="button">Show answer</button>
        </div>
        <div class="practice-controls" id="grade-controls" hidden>
          <button id="learning-btn" type="button" class="btn-secondary">Still learning</button>
          <button id="medium-btn" type="button" class="btn-medium">Medium</button>
          <button id="know-btn" type="button">I know this ✅</button>
        </div>
      </section>

      <section id="words-panel" class="tab-panel">
        <div id="words-groups"></div>
      </section>
    </main>

    <nav class="tab-bar">
      <button class="tab-button active" data-target="add-panel" type="button">➕ Add</button>
      <button class="tab-button" data-target="practice-panel" type="button">🧠 Practice</button>
      <button class="tab-button" data-target="words-panel" type="button">📚 Words</button>
    </nav>

    <script src="/js/db.js"></script>
    <script src="/js/categories.js"></script>
    <script src="/js/push.js"></script>
    <script src="/js/practice.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
